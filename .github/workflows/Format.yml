name: Format

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      # Pinned on purpose: an unpinned formatter has twice reformatted this repo from under CI.
      # The style itself lives in .JuliaFormatter.toml.
      - name: Check formatting
        run: |
          julia -e '
            using Pkg
            Pkg.add(PackageSpec(name = "JuliaFormatter", version = "2.1"))
            using JuliaFormatter
            format(".") || begin
                write(stdout, read(`git diff`, String))
                error("Some files are not formatted. Run JuliaFormatter locally and commit the result.")
            end'
